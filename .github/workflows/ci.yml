name: StudentHub CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch Name Check
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Checking branch: $BRANCH"
          if echo "$BRANCH" | grep -qiE '^(feature|fix|chore)/STU-[a-z0-9]+[-a-z0-9]+$'; then
            echo "Branch name OK: $BRANCH"
          else
            echo "Branch name REJECTED: $BRANCH"
            echo "Expected: feature/STU-N-*, fix/STU-N-*, or chore/STU-N-* (kebab-case)"
            exit 1
          fi

  clean-tree:
    name: Clean Working Tree
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "Working tree is dirty after npm ci — uncommitted changes detected"
            exit 1
          fi
          echo "Working tree is clean"

  typescript:
    name: TypeScript Check
    runs-on: macos-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - run: npx tsc --noEmit

  build:
    name: Next.js Build
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Cache Next.js build
        uses: actions/cache@v4
        id: next-cache
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      - name: Build
        run: npx next build

  lint:
    name: ESLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint

  unit-test:
    name: Unit Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vitest run

  e2e:
    name: E2E Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: studenthub
          MYSQL_DATABASE: studenthub_prod_local
          MYSQL_USER: studenthub
          MYSQL_PASSWORD: studenthub
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://studenthub:studenthub@localhost:3307/studenthub_prod_local?auth_plugin=mysql_native_password"
      - name: Push schema to MySQL
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "mysql://studenthub:studenthub@localhost:3307/studenthub_prod_local?auth_plugin=mysql_native_password"
      - name: Seed E2E test fixtures
        run: npx tsx prisma/seed-test-fixtures.ts
        env:
          DATABASE_URL: "mysql://studenthub:studenthub@localhost:3307/studenthub_prod_local?auth_plugin=mysql_native_password"
      - name: Cache Next.js build
        uses: actions/cache@v4
        id: next-cache-e2e
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-e2e-
      - name: Build
        run: npx next build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          DATABASE_URL: "mysql://studenthub:***@localhost:3307/studenthub_prod_local?auth_plugin=mysql_native_password"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      - name: Run E2E tests
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CI: "true"
          DATABASE_URL: "mysql://studenthub:studenthub@localhost:3307/studenthub_prod_local?auth_plugin=mysql_native_password"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

  validate:
    name: Validation Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: studenthub
          MYSQL_DATABASE: studenthub_prod_local
          MYSQL_USER: studenthub
          MYSQL_PASSWORD: studenthub
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Push schema to MySQL
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "mysql://studenthub:studenthub@localhost:3307/studenthub_prod_local?auth_plugin=mysql_native_password"
      - name: Build
        run: npx next build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      - name: Start and validate
        run: |
          npm run dev &
          # Wait for dev server to be ready
          for i in $(seq 1 20); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login | grep -q "200\|307"; then
              echo "Dev server ready after ${i}s"
              break
            fi
            sleep 2
          done
          node scripts/validate.mjs
        env:
          DATABASE_URL: "mysql://studenthub:studenthub@localhost:3307/studenthub_prod_local?auth_plugin=mysql_native_password"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
