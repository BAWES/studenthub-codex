# =============================================================================
# StudentHub Next — Production Stack
# Next.js app + MySQL + Redis + MinIO (S3-compatible storage)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MySQL — Primary database
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: studenthub-next-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-studenthub_sample}"
      MYSQL_USER: "${MYSQL_USER:-studenthub}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-studenthub}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-studenthub_root}"
    ports:
      - "3307:3306"
    volumes:
      - studenthub-next-mysql:/var/lib/mysql
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--max-allowed-packet=64M"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - studenthub-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis — Cache / session store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: studenthub-next-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - studenthub-next-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studenthub-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: studenthub-next-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-studenthub}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-studenthub_minio_secret}"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - studenthub-next-minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - studenthub-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # MinIO Bucket Setup — one-shot init to create the temp bucket
  # ---------------------------------------------------------------------------
  minio-setup:
    image: minio/mc:latest
    container_name: studenthub-next-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: "http://${MINIO_ROOT_USER:-studenthub}:${MINIO_ROOT_PASSWORD:-studenthub_minio_secret}@minio:9000"
    entrypoint: >
      /bin/sh -c "
      until mc ls local >/dev/null 2>&1; do echo 'waiting for minio...'; sleep 2; done;
      mc mb local/studenthub-temp --ignore-existing;
      echo 'Bucket studenthub-temp ready.';
      "
    networks:
      - studenthub-net
    deploy:
      resources:
        limits:
          memory: 64M

  # ---------------------------------------------------------------------------
  # Next.js Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studenthub-next-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://${MYSQL_USER:-studenthub}:${MYSQL_PASSWORD:-studenthub}@mysql:3306/${MYSQL_DATABASE:-studenthub_sample}"
      AUTH_SECRET: "${AUTH_SECRET}"

      # Redis (for future caching)
      REDIS_URL: "redis://redis:6379"

      # MinIO / S3 config
      AWS_ENDPOINT_URL: "http://minio:9000"
      AWS_TEMP_BUCKET_REGION: "us-east-1"
      AWS_TEMP_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-studenthub}"
      AWS_TEMP_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-studenthub_minio_secret}"
      AWS_TEMP_BUCKET_NAME: "studenthub-temp"
      AWS_REGION: "us-east-1"
      AWS_S3_BUCKET: "studenthub-temp"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-studenthub}"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_BUCKET: "studenthub-temp"

      # Force S3 path-style addressing for MinIO compatibility
      AWS_S3_FORCE_PATH_STYLE: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - studenthub-net
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  studenthub-next-mysql:
  studenthub-next-redis:
  studenthub-next-minio:

networks:
  studenthub-net:
    driver: bridge
