services:
  # =============================================================================
  # MySQL — primary database (existing, enhanced with healthcheck)
  # =============================================================================
  mysql:
    image: mysql:8.4
    container_name: studenthub-next-mysql
    environment:
      MYSQL_DATABASE: studenthub_prod
      MYSQL_USER: studenthub
      MYSQL_PASSWORD: studenthub
      MYSQL_ROOT_PASSWORD: studenthub_root
    ports:
      - "3307:3306"
    volumes:
      - studenthub-next-mysql:/var/lib/mysql
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pstudenthub_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - studenthub-network

  # =============================================================================
  # Redis — caching and session/queue backend
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: studenthub-next-redis
    ports:
      - "6379:6379"
    volumes:
      - studenthub-next-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - studenthub-network

  # =============================================================================
  # MinIO — S3-compatible object storage
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: studenthub-next-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - studenthub-next-minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - studenthub-network

  # =============================================================================
  # MinIO Init — create the required bucket
  # =============================================================================
  minio-init:
    image: minio/mc:latest
    container_name: studenthub-next-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/studenthub-temp --ignore-existing &&
      echo 'Bucket created/verified' &&
      exit 0
      "
    restart: no
    networks:
      - studenthub-network

  # =============================================================================
  # Next.js App — production server
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studenthub-next-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://studenthub:studenthub@mysql:3306/studenthub_prod
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      REDIS_URL: redis://redis:6379
      AWS_TEMP_BUCKET_REGION: us-east-1
      AWS_TEMP_BUCKET_NAME: studenthub-temp
      AWS_TEMP_ACCESS_KEY_ID: minioadmin
      AWS_TEMP_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - studenthub-network

networks:
  studenthub-network:
    name: studenthub-network
    driver: bridge

volumes:
  studenthub-next-mysql:
  studenthub-next-redis:
  studenthub-next-minio:
